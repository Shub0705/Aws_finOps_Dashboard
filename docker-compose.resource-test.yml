services:
  backend-resource-test:
    build:
      context: ./backend

    container_name: finops-backend-resource-test

    ports:
      - "127.0.0.1:8003:8000"

    env_file:
      - ./secrets/backend-db.env

    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_CONFIG_FILE: /home/appuser/.aws/config

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${HOME}/.aws/config:/home/appuser/.aws/config:ro
      - ${HOME}/.aws/sso/cache:/home/appuser/.aws/sso/cache:rw

    restart: unless-stopped
