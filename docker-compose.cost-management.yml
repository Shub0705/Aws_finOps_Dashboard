services:
  cost-db:
    image: postgres:16
    container_name: cloudpilot-cost-db
    environment:
      POSTGRES_DB: cloudpilot_costs
      POSTGRES_USER: cloudpilot
      POSTGRES_PASSWORD: ${COST_DB_PASSWORD:?Set COST_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - cloudpilot_cost_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpilot -d cloudpilot_costs"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  cloudpilot_cost_data:
